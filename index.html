<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#272330"><meta name="description" content="八关生涯，七名对手，漫画摩托公路乱斗。"><title>漫画摩托 · 公路乱斗</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="ui-depth.css"><link rel="stylesheet" href="progression.css"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="manifest" href="manifest.webmanifest"></head>
<body><main id="app" data-screen="loading"><canvas id="scene" width="1280" height="720" tabindex="0" role="img" aria-label="游戏素材载入中"></canvas><section id="overlay" class="overlay"><div class="load-card"><p class="eyebrow">COMIC MOTO</p><h1>下一段路，等你出发。</h1><p id="load-text">正在载入本地素材…</p><progress id="load-progress" value="0" max="1"></progress></div></section><nav id="race-tools" class="race-tools" hidden><button id="race-pause" aria-label="暂停比赛">Ⅱ</button><button id="race-sound" aria-label="声音开关">♪</button><button id="fullscreen" aria-label="全屏">⛶</button></nav><div id="touch-controls" class="touch-controls" hidden><div><button data-action="left" aria-label="左转">◀</button><button data-action="right" aria-label="右转">▶</button><button data-action="brake" aria-label="刹车">S</button></div><div><button data-action="attackLeft" aria-label="左攻击">J</button><button data-action="attackRight" aria-label="右攻击">K</button><button data-action="nitro" aria-label="加速">⚡</button><button data-action="heal" aria-label="恢复">✚</button><button data-action="throttle" aria-label="油门">W</button></div></div><div id="toast" class="toast" role="status" hidden></div><div id="save-error" class="save-error" role="alert" hidden></div><div class="rotate-tip" hidden>建议横屏游玩 / Landscape recommended</div></main>
